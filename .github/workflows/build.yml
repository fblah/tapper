name: Build APK
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then VERSION="1.0-dev"; fi
          gradle :app:assembleDebug -PappVersion="$VERSION" -PappVersionCode="${{ github.run_number }}"
      - run: cp app/build/outputs/apk/debug/app-debug.apk tapper-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tapper-debug-apk
          path: tapper-debug.apk

      # Rolling "latest" release: always points at the newest build, downloadable without login
      # (as long as the repository is public).
      - name: Publish latest release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest tapper-debug.apk \
            --title "Tapper (latest build)" \
            --notes "Debug APK built from ${{ github.sha }} on branch ${{ github.ref_name }}." \
            --target "${{ github.sha }}" \
            --prerelease

      # Tagged release (git tag v1.2.3 && git push origin v1.2.3): permanent, versioned download.
      - name: Publish versioned release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp tapper-debug.apk "tapper-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "tapper-${GITHUB_REF_NAME}.apk" \
            --title "Tapper ${GITHUB_REF_NAME}" \
            --generate-notes
